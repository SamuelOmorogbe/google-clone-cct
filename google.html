<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="google.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-
    QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main">
      <p class="text">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span
        ><span style="font-size: 90px">e</span>
      </p>
      <div class="search-bar">
        <p class="plus">+</p>
        <i
          class="fa fa-microphone"
          aria-hidden="true"
          id="mic"
          style="color: white"
        ></i>
        <i class="fa fa-camera" aria-hidden="true" id="cam"></i>
        <div class="button">
          <i class="fa-solid fa-magnifying-glass" id="search"></i>
          <p class="ai">AI Mode</p>
        </div>
        <input type="search" placeholder="search" />
        <div class="two">
          <div>
            <p id="btn">Google Search</p>
          </div>
          <div>
            <p id="btn">I'm Feeling Lucky</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
